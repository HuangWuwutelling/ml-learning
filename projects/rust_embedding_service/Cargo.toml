[package]
name = "rust_embedding_service"
version = "0.1.0"
edition = "2024"
description = "Stage 3 of 副线 3: async Rust embedding service (axum + tokio + candle)"
license = "MIT"

# The router lives in the lib so tests/ can drive it in-process via
# tower::ServiceExt::oneshot without opening a real port.
[lib]
name = "rust_embedding_service"
path = "src/lib.rs"

[[bin]]
name = "rust_embedding_service"
path = "src/main.rs"

[dependencies]
axum = "0.8"
candle-core = "0.11"
# candle-transformers uses VarBuilder from candle-nn but does not re-export it.
candle-nn = "0.11"
candle-transformers = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# Not "1.0.0-rc.3" -- the newest published tag is a release candidate. 0.21 is
# the last stable line, and it is what candle-transformers 0.11 builds against.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Only TraceLayer in Stage 3. `timeout` needs a real inference latency to set a
# budget against, and `cors` is meaningless until there is a browser client.
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[dev-dependencies]
# tower::ServiceExt::oneshot — send a request through the Router in-process.
tower = { version = "0.5", features = ["util"] }